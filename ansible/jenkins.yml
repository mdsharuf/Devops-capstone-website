- name: Install Java 17 and Jenkins on jenkins host
  hosts: jenkins
  become: yes
  vars:
    jenkins_repo_file: /etc/apt/sources.list.d/jenkins.list
    jenkins_keyring: /usr/share/keyrings/jenkins-keyring.gpg
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    # Preferred modern approach: fetch GPG to keyring and use signed-by
    - name: Download Jenkins key to keyring
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
        dest: "{{ jenkins_keyring }}"
        mode: "0644"

    - name: Add Jenkins apt repository (signed-by keyring)
      apt_repository:
        repo: "deb [signed-by={{ jenkins_keyring }}] https://pkg.jenkins.io/debian-stable binary/"
        state: present

    - name: Update apt cache after adding repo
      apt:
        update_cache: yes

    - name: Install OpenJDK 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Ensure jenkins is enabled and started
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Wait for Jenkins to be listening on 8080
      wait_for:
        port: 8080
        host: "{{ ansible_host | default(inventory_hostname) }}"
        timeout: 120

