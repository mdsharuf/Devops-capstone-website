# get json outputs from terraform (adjust path)
cd terraform
terraform output -json workers_public_ips > ../tf_workers_ips.json
cd ..

# build inventory (example quick-and-dirty approach)
IPS=$(jq -r '.workers_public_ips.value[]' tf_workers_ips.json)

# map indices to roles: 0->jenkins,1->worker2,2->master,3->worker4
i=0
echo "[jenkins]" > ansible/inventory.ini
for ip in $IPS; do
  if [ "$i" -eq 0 ]; then
    echo "$ip ansible_user=ubuntu ansible_private_key_file=~/.ssh/yourkey" >> ansible/inventory.ini
  fi
  i=$((i+1))
done

# Add master
i=0
echo "" >> ansible/inventory.ini
echo "[k8s_master]" >> ansible/inventory.ini
for ip in $IPS; do
  if [ "$i" -eq 2 ]; then
    echo "$ip ansible_user=ubuntu ansible_private_key_file=~/.ssh/yourkey" >> ansible/inventory.ini
  fi
  i=$((i+1))
done

# Add workers
i=0
echo "" >> ansible/inventory.ini
echo "[k8s_workers]" >> ansible/inventory.ini
for ip in $IPS; do
  if [ "$i" -eq 1 ] || [ "$i" -eq 3 ]; then
    echo "$ip ansible_user=ubuntu ansible_private_key_file=~/.ssh/yourkey" >> ansible/inventory.ini
  fi
  i=$((i+1))
done

echo "" >> ansible/inventory.ini
echo "[all:vars]" >> ansible/inventory.ini
echo "ansible_python_interpreter=/usr/bin/python3" >> ansible/inventory.ini

